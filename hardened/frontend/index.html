<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Exercise Frontend</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <h1>Todo List App</h1>
    <div id="out">Loading...</div>
    <div id="db">Checking DB...</div>
    <form id="todoForm">
      <input id="todoTitle" type="text" placeholder="Add a new task" autocomplete="off" />
      <button type="submit">Add Todo</button>
    </form>
    <ul id="todoList"></ul>
    <script>
      const apiHost = 'http://localhost:8081/api';

      async function load() {
        document.getElementById('out').textContent = 'Loading todos...';
        await refreshDb();
        await loadTodos();
      }

      async function fetchJson(url, options) {
        const res = await fetch(url, options);
        if (!res.ok) {
          const err = await res.text();
          throw new Error(err || res.statusText);
        }
        return res.status === 204 ? null : res.json();
      }

      async function refreshDb() {
        try {
          const j = await fetchJson(`${apiHost}/dbstatus`);
          document.getElementById('db').textContent = `DB: ${j.db} (${j.row_count} todos)`;
        } catch (e) {
          document.getElementById('db').textContent = 'DB unreachable';
        }
      }

      async function loadTodos() {
        try {
          const todos = await fetchJson(`${apiHost}/todos`);
          renderTodos(todos);
          document.getElementById('out').textContent = 'Todo list loaded';
        } catch (e) {
          document.getElementById('out').textContent = 'Could not load todos';
        }
      }

      function renderTodos(todos) {
        const list = document.getElementById('todoList');
        list.innerHTML = '';
        if (!todos || todos.length === 0) {
          list.innerHTML = '<li>No todos yet.</li>';
          return;
        }
        todos.forEach(todo => {
          const item = document.createElement('li');
          item.className = todo.done ? 'done' : '';
          item.innerHTML = `
            <label><input type="checkbox" ${todo.done ? 'checked' : ''} data-id="${todo.id}" /> ${todo.title}</label>
            <button data-delete="${todo.id}">Delete</button>
          `;
          item.querySelector('input').addEventListener('change', async (event) => {
            await updateTodo(todo.id, todo.title, event.target.checked);
          });
          item.querySelector('button').addEventListener('click', async () => {
            await deleteTodo(todo.id);
          });
          list.appendChild(item);
        });
      }

      async function addTodo(title) {
        await fetchJson(`${apiHost}/todos`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({title})
        });
        await loadTodos();
        await refreshDb();
      }

      async function updateTodo(id, title, done) {
        await fetchJson(`${apiHost}/todos/${id}`, {
          method: 'PUT',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({title, done})
        });
        await loadTodos();
        await refreshDb();
      }

      async function deleteTodo(id) {
        await fetchJson(`${apiHost}/todos/${id}`, {method: 'DELETE'});
        await loadTodos();
        await refreshDb();
      }

      document.getElementById('todoForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const input = document.getElementById('todoTitle');
        const title = input.value.trim();
        if (!title) {
          return;
        }
        await addTodo(title);
        input.value = '';
      });

      console.log('01010011 01001111 01010011: 66 114 105 98 105 110 103 32 116 104 101 32 104 97 109 115 116 101 114 46 32 72 111 119 32 97 114 101 32 98 117 115 121 32 116 111 32 104 101 108 112 32 121 111 117 Z29ibGluIGFuZCBncmVtbGlucyBhcmUgYnVzeQ==');

      load();
    </script>
  </body>
</html>
